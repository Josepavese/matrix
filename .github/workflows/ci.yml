name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
    - name: Secret scan
      run: bash scripts/security_secret_scan.sh

  governance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version: '1.27.1'
    - name: Governance manifest
      run: go run ./scripts/governance_check --manifest governance/manifest.toml
    - name: Code governance
      run: go run ./scripts/code_governance.go --config code-governance.toml

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version: '1.27.1'
    - name: golangci-lint
      uses: golangci/golangci-lint-action@63c23d5020da8f97005b6de340504130bdbe42c7 # v9
      with:
        version: v2.13.2

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version: '1.27.1'
    - name: Test
      run: go test -race -v ./...

  windows-codex-policy:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version: '1.27.1'
    - name: Set up Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '22'
    - name: Canonical Codex launch policy
      shell: pwsh
      env:
        MATRIX_CODEX_POLICY_REAL: '1'
        MATRIX_CODEX_POLICY_PACKAGE: '@agentclientprotocol/codex-acp@1.1.9'
      run: go test ./tests/integration -run TestSmoke_InstalledCanonicalCodexAppliesFullAccessPolicy -count=1 -v -timeout 5m

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version: '1.27.1'
    - name: Build matrix
      run: go build ./cmd/matrix

  release-dry-run:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version: '1.27.1'
    # The dry run exercises the same .goreleaser.yml as a tagged release,
    # including its sboms section, and GoReleaser fails rather than skips a pipe
    # whose command is missing. Installing syft here is what makes this job
    # prove the SBOM configuration before a tag depends on it.
    - name: Install syft
      uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      with:
        syft-version: v1.52.0
    - name: GoReleaser snapshot
      uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
      with:
        distribution: goreleaser
        version: v2.15.3
        args: release --snapshot --clean

  install-ps1-security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
    # The Windows installer is the one release artifact that cannot be exercised
    # on this workstation. Its security-relevant guards (checksum verification
    # and archive path rejection) are platform independent, so they are tested
    # here; PowerShell ships with the runner image.
    - name: Test install.ps1 security guards
      shell: pwsh
      run: ./tests/install_ps1_security_test.ps1

  install-sh-assets:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
    # The release document addressed by tag can be served with an empty asset
    # list while the assets are downloadable. install.sh falls back to the
    # id-addressed endpoint in that case; curl is stubbed so the condition is
    # reproducible instead of waiting for GitHub to be stale.
    - name: Test install.sh asset resolution
      run: bash tests/install_sh_asset_test.sh

  quality-gate:
    runs-on: ubuntu-latest
    # About nine minutes on a warm local cache, so it runs where the ratchet
    # matters - on main - and not in front of every pull request, whose feedback
    # loop the ordinary test job already covers.
    if: github.event_name == 'push'
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version: '1.27.1'
    # The ratchet existed but nobody ran it: coverage floors, fuzz targets and the
    # mutation campaign live in scripts/quality_gate.sh, which no workflow invoked,
    # so a change could drop a package below its coverage floor with CI green. That
    # is not hypothetical - adding the agent-auth handler to internal/providers/runapi
    # took it to 67.4% against a 69% floor and every job still passed.
    - name: Quality gate (light)
      run: bash scripts/quality_gate.sh --light

  windows-validation-host:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
    # The guest console cannot be driven from CI, but the host half of the
    # validation can: serving the script, collecting the report and judging it. The
    # self-test drives that plumbing with a synthetic report, including the case
    # where a check failed and the run must not be reported as valid.
    - name: Self-test the Windows validation collector
      run: bash tests/windows_validation_host.sh --self-test --port 8099
