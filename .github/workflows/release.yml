name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Validate SemVer tag
        run: |
          if ! printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Release tags must look like vX.Y.Z, optionally with SemVer prerelease/build metadata." >&2
            exit 1
          fi
      - name: Require successful CI on tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tagged_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          # The history must not be truncated: a shallow fetch makes the
          # ancestor check below impossible to satisfy unless the tag is exactly
          # the tip of main, which is not how release commits are tagged.
          git fetch origin main
          if ! git merge-base --is-ancestor "$tagged_commit" origin/main; then
            echo "Tagged commit $tagged_commit is not reachable from origin/main." >&2
            exit 1
          fi
          success_run="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${tagged_commit}&status=completed&per_page=20" --jq '.workflow_runs[] | select(.conclusion == "success" and .event == "push" and .head_branch == "main") | .id' | head -n 1)"
          if [[ -z "$success_run" ]]; then
            echo "No successful main push CI workflow run found for tagged commit $tagged_commit." >&2
            echo "Create release tags only after CI is green on the exact commit being tagged." >&2
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${tagged_commit}&per_page=20" --jq '.workflow_runs[] | "\(.id)\t\(.status)\t\(.conclusion)\t\(.html_url)"' >&2 || true
            exit 1
          fi
          echo "Found successful CI workflow run $success_run for $tagged_commit."

  goreleaser:
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Attesting is what makes the published bytes verifiable rather than
      # merely downloadable: id-token lets the job prove its workflow identity
      # to Sigstore, and attestations stores the signed result against this
      # repository, where the REST API serves it back per subject digest. Both
      # are scoped to this job, which is the only one that runs after publishing.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.27.1'
      # .goreleaser.yml's sboms section shells out to syft for every archive, and
      # GoReleaser fails the release when the command is missing, so syft has to
      # be on PATH before GoReleaser runs. The version is pinned because the SBOM
      # is a published artifact: a syft upgrade should be a reviewed change, not
      # a silent difference between two releases. goreleaser-action installs
      # GoReleaser only, not the tools its pipes call.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.52.0
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          distribution: goreleaser
          version: v2.15.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Provenance is attested from the same dist/ files GoReleaser uploaded, so
      # the subject digests are the published bytes and no second build can drift
      # from them. subject-checksums covers everything checksums.txt lists - the
      # six archives and their six SBOMs; checksums.txt is not an entry in its
      # own list. The attestation lands in GitHub's attestation store rather than
      # the asset list, so scripts/verify_release.sh reads it back from
      # /repos/{owner}/{repo}/attestations/{digest} instead of looking for a
      # fifteenth asset.
      - name: Attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-checksums: dist/checksums.txt
