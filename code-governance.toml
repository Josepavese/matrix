# capability-gated rich content, authentication/lifecycle controls, full
# operation reports, A2A task/push/profile facades, and zero-legacy rejection.
# The implementation is split into focused files; file/function/branch budgets
# remain clean and this exact package baseline is not permission for growth.
# 2026-07-24: ACP client leases defer physical close while sibling runs still
# use one router-lifetime client; new routes move to a fresh cached client.
# 2026-08-04: exact configured provider mode is verified on ACP new/resume/load
