[metadata]
name = "matrix-governance"
version = "1"
purpose = "Release gate for Matrix product, architecture, code, test, issue, and deploy governance."

[documents]
required = [
  "docs/governance/README.md",
  "docs/governance/product_governance.md",
  "docs/governance/architecture_governance.md",
  "docs/governance/protocol_channel_governance.md",
  "docs/governance/code_governance.md",
  "docs/governance/code_debt_register.md",
  "docs/governance/architecture_guardrails.md",
  "docs/governance/deploy_governance.md",
  "docs/governance/test_evidence_governance.md",
  "docs/governance/issue_governance.md",
  "docs/governance/issue_triage_template.md",
  "docs/governance/release_evidence_template.md",
  "docs/governance/security_governance.md",
  "docs/governance/concurrent_workstations.md",
  "docs/governance/zero_legacy_governance.md",
  "docs/wiki/Governance.md",
  "code-governance.toml",
  "docs/matrix_deployment_policy.md",
  "docs/matrix_release_runbook.md",
  "docs/matrix_protocol_neutral_runtime.md",
  "docs/protocol_coverage.md",
  "docs/matrix_zed_acp_compliance.md",
  "docs/matrix_production_readiness.md"
]

[required_text]
"docs/governance/README.md" = ["governance/manifest.toml", "governance_check", "release gate"]
"docs/governance/product_governance.md" = ["crossroads", "human-to-agent", "agent-to-agent", "one-to-many", "many-to-many"]
"docs/governance/architecture_governance.md" = ["protocol-neutral", "channel-neutral", "PAL", "vault", "SSOT"]
"docs/governance/protocol_channel_governance.md" = ["ACP", "A2A", "Telegram", "HTTP", "capability"]
"docs/governance/code_governance.md" = ["code-governance.toml", "override", "budget"]
"docs/governance/code_debt_register.md" = ["Total quality warnings", "Maximum branch points", "Ratchet"]
"docs/governance/architecture_guardrails.md" = ["pattern_budget", "Protocol SDK", "Telegram", "PAL home"]
"docs/governance/deploy_governance.md" = ["GitHub Actions", "GoReleaser", "local install", "release evidence"]
"docs/governance/test_evidence_governance.md" = ["real-agent", "smoke", "evidence"]
"docs/governance/issue_governance.md" = ["issues/closed", "accepted", "rejected"]
"docs/governance/issue_triage_template.md" = ["accepted", "rejected", "issues/closed"]
"docs/governance/release_evidence_template.md" = ["Release Identity", "GitHub Actions", "Local Install", "Runtime Evidence"]
"docs/governance/security_governance.md" = ["vault", "secret", "installer", "token"]
"docs/governance/zero_legacy_governance.md" = ["ZERO-LEGACY", "fail closed", "one-way", "PAL", "codex", "current stable", "retired wire shape"]
"docs/wiki/Governance.md" = ["governance_check", "protocol-neutral", "channel-neutral", "release evidence"]
"docs/matrix_zed_acp_compliance.md" = ["Zed Agent Client Protocol", "session/fork", "additionalDirectories", "side"]
"docs/protocol_coverage.md" = ["ACP v1 stable coverage", "A2A v1.0.1 coverage", "ZERO-LEGACY", "ListTaskPushConfigs", "GetExtendedAgentCard"]

[preflight]
file = "scripts/deploy_preflight.sh"
required = [
  "go run ./scripts/governance_check --manifest governance/manifest.toml",
  "go run ./scripts/code_governance.go --config code-governance.toml",
  "golangci-lint run",
  "go test -race -v ./...",
  "go build -o \"$build_dir/matrix\" ./cmd/matrix",
  "goreleaser check"
]

[ci]
file = ".github/workflows/ci.yml"
required = [
  "go run ./scripts/governance_check --manifest governance/manifest.toml",
  "go run ./scripts/code_governance.go --config code-governance.toml"
]

[release_workflow]
file = ".github/workflows/release.yml"
required = [
  "tags:",
  "contents: write",
  "goreleaser/goreleaser-action",
  "release --clean",
  "GITHUB_TOKEN"
]

[goreleaser]
file = ".goreleaser.yml"
required = [
  "goos:",
  "linux",
  "darwin",
  "windows",
  "goarch:",
  "amd64",
  "arm64",
  "LICENSE",
  "install/install.sh",
  "install/install.ps1",
  "checksums.txt"
]

[readme]
file = "README.md"
required = [
  "Human to agent",
  "Agent to agent",
  "One to many",
  "Many to many",
  "Install without cloning the repo"
]

[pattern_budget.protocol_sdk_imports_in_logic]
roots = ["internal/logic"]
patterns = [
  "github.com/Josepavese/matrix/pkg/zedacp",
  "github.com/a2aproject/a2a-go"
]
allowed_files = [
  "internal/logic/agentdiscovery/discovery.go",
  "internal/logic/agentdiscovery/card_provider.go"
]
max = 0
reason = "Protocol SDK usage must stay behind provider adapters or explicit discovery seams."

[pattern_budget.telegram_provider_imports_outside_channel_runtime]
roots = ["cmd", "internal/logic", "internal/middleware"]
patterns = [
  "github.com/Josepavese/matrix/internal/providers/telegram"
]
allowed_files = [
  "internal/logic/channelruntime/runtime.go"
]
max = 0
reason = "Telegram must remain one channel behind channel runtime composition."

[pattern_budget.pal_home_bypass]
roots = ["cmd", "internal", "pkg"]
patterns = [
  "os.UserHomeDir("
]
allowed_files = [
  "internal/logic/matrixhome/home.go",
  "internal/providers/fusefs/provider_common.go",
  "internal/providers/osfs/fs.go"
]
max = 0
reason = "PAL home resolution must stay centralized and provider-backed."

[pattern_budget.deprecated_codex_provider]
roots = ["cmd", "configs", "internal", "pkg", "scripts", "install", ".github"]
patterns = [
  "@zed-industries/codex-acp"
]
allowed_files = [
  "internal/logic/agentidentity/codex.go",
  "internal/logic/agentidentity/codex_test.go"
]
max = 0
reason = "ZERO-LEGACY: the retired Codex provider may exist only at its centralized rejection boundary and in rejection tests."

[pattern_budget.retired_acp_wire_contract]
roots = ["pkg/zedacp", "internal/providers/agents", "internal/middleware"]
patterns = [
  "AuthEnvVar",
  "credentials map[string]string",
  "json:\"capabilities,omitempty\""
]
allowed_files = ["internal/middleware/link.go"]
max = 0
reason = "ZERO-LEGACY: ACP authentication accepts methodId only and initialization accepts agentCapabilities only."

[pattern_budget.direct_bolt_cli_access]
roots = ["cmd/matrix"]
patterns = [
  "bolt.NewProvider("
]
allowed_files = [
]
max = 0
reason = "The daemon owns bbolt through runtimevault startup coordination; CLI commands must use the authenticated runtime Vault broker."

[pattern_budget.bbolt_sdk_outside_provider]
roots = ["cmd", "internal/logic", "internal/middleware", "pkg"]
patterns = [
  "go.etcd.io/bbolt",
  "bbolt.Open("
]
allowed_files = []
max = 0
reason = "Raw bbolt access is provider-owned; logic and CLI diagnostics must use the daemon broker instead of opening the Vault file."

# AGNOSTICISM — Matrix must not behave differently by agent or provider name.
# The three budgets below make that constraint mechanical instead of a promise.
# They exist because of the externally reported issues on OpenCode and MiMo, and
# because the audit recorded in docs/governance/agnosticism_audit_baseline_2026-10-01.md
# found pre-existing per-name branches that must not be extended.
# Measured on the frozen tree 6a4c745 (2026-10-01), production Go only:
#   quoted agent-name literals: 16    branch-shaped comparisons: 2    ad-hoc names: 0

# RATCHET. Agent names are data, not behaviour: defaults, registry values, help
# text and comments are legitimate and stay. What this freezes is the VOCABULARY:
# a new agent name in production code is a new per-agent decision until the Lead
# says otherwise. Tests and fixtures are excluded on purpose — a revert-proof
# test must stay free to name the agent it generalises away from.
[pattern_budget.agent_name_literals_in_logic]
roots = ["cmd", "internal", "pkg"]
patterns = ["\"opencode\"", "\"codex\"", "\"claude\"", "\"gemini\""]
exclude_suffixes = ["_test.go", ".md"]
# 2026-10-02: documentation is excluded because these budgets measure behaviour
# and a markdown file cannot run. A revert register has to name the agent whose
# branch it describes, which is exactly the text these budgets count: keeping it
# in scope forced a choice between an unreadable register and a red gate.
exclude_dirs = ["testdata"]
max = 13
reason = "AGNOSTICISM RATCHET: 16 literals at baseline 6a4c745, 14 measured at 664ac61 after the declaration-based launch refactor removed two, 13 measured 2026-10-02 when the wizard's seven name dispatches became flow ownership — the last literal that existed only to name an agent in a branch went with them. The thirteen that remain are data, not dispatch: the default agent, the codex handler's own agent (the binary and config entry its own flow uses), and the registry keys that bind a flow to the agents using it. The ratchet moves down with the tree, so what was removed cannot come back unnoticed. A new literal needs the Lead's justification: adding support for a new agent is exactly the case that must be a reviewed decision, not a silent branch."

# ZERO TOLERANCE. These names have no legitimate producer-side occurrence at
# baseline: any literal in production code is an agent-specific patch. The test
# fixtures that use mimo/kimi to prove the executable lookup is name-agnostic
# live in *_test.go and are excluded here, exactly so that proof stays possible.
[pattern_budget.adhoc_agent_name_literals]
roots = ["cmd", "internal", "pkg"]
patterns = ["\"mimo\"", "\"minimax\"", "\"halfpocket\"", "\"kimi\"", "\"deepseek\""]
exclude_suffixes = ["_test.go", ".md"]
exclude_dirs = ["testdata"]
max = 0
reason = "AGNOSTICISM: zero occurrences at baseline; a literal here is a patch for a specific agent, which the user forbade."

# SHAPE OF THE BRANCH, not the name. Counting the shape catches a branch on a
# name that appears in no list at all, which enumeration cannot. The empty-string
# guard (agentID == "") does not match, so the 29 legitimate guards stay
# invisible and healthy code is never blocked. Both baseline matches are gone:
# the budget closes at zero, and the first new branch fails it.
[pattern_budget.agent_identity_branch_shape]
roots = ["cmd", "internal", "pkg"]
regex_patterns = [
  "(agentID|agentName|AgentID|agent_id)\\s*[!=]=\\s*\"[^\"]+\"",
  "EqualFold\\s*\\(\\s*(agentID|agentName|AgentID|agent_id)\\s*,\\s*\"",
  "EqualFold\\s*\\(\\s*strings\\.TrimSpace\\((agentID|agentName|AgentID|agent_id)\\)\\s*,\\s*\"",
  "switch\\s+(agentID|agentName|AgentID|agent_id)\\b"
]
exclude_suffixes = ["_test.go", ".md"]
exclude_dirs = ["testdata"]
max = 0
reason = "AGNOSTICISM: 2 branch-shaped comparisons at baseline 6a4c745 (agentlaunch/codex.go:34, onboarding/wizard.go:308); both are gone — the first with the file, deleted in 39ae9cb, the second rewritten in 92144aa to read the auth method's own declaration — so the budget closes at zero. Verified by probe: a scratch `agentID == \"codex\"` in production fails with count 1 exceeds max 0. The generic-variable limit this budget could not close is closed by identity_comparison_shape below."

# AST SHAPE CHECK — closes the limit the regex budget above declares. The textual
# budgets count names somebody enumerated; this one reads the SYNTAX TREE and
# recognises the shape of a name-based branch, so a comparison on a generic
# variable against a name nobody has ever listed — `if name == "newagent"` —
# fails the gate.
#
# The criterion is a ROLE, not a literal: an equality test between a NAMED value
# and a non-empty string literal, where the name says WHICH agent/provider/
# program/model is being talked to (an identity) instead of WHAT KIND of thing
# this is (a classifier). Classifiers — kind, transport, status, phase, origin,
# mode, type, protocol, section, method — are not in identity_names, so
# `kind == "acp"` and the 29 empty-string guards keep passing untouched.
#
# identity_names is a vocabulary of ROLES, never of agents: it lists the names
# whose value is an identity, not the identities themselves. A map key is covered
# by the role it carries — state.Context["provider"] is matched by "provider" —
# so a role is listed once and cannot be half-added. reviewed_pairs clears a
# specific name/literal PAIR (`name=fork`), never a name (`name=…`), so clearing
# one benign value can never blind the check to the next one.
#
# Measured at baseline on the frozen tree: 160 comparisons of a value against a
# non-empty string literal in production, 8 of them identity comparisons, 7 of
# them the reviewed pairs below, 1 the pre-existing branch already ratcheted by
# agent_identity_branch_shape. Any additional identity comparison — in any file,
# under any identity name, against any literal — makes the count 2 and fails.
[pattern_budget.identity_comparison_shape]
roots = ["cmd", "internal", "pkg"]
ast_rule = "identity_comparison"
# agent_name_values are the strings that denominate an agent. They do NOT decide
# the finding — the shape does, exactly as it does for a literal — they decide
# what the finding SAYS: whether the constant a branch compares against names a
# known agent, or is some other value the reviewer must judge. The check reads a
# package constant's VALUE out of the tree, because a branch hidden behind
# `CanonicalCodexAgentID` is the branch `== "codex"` one indirection away, and a
# probe measured that the constant form passed every budget while the literal form
# failed three. The match is a whole word, case-insensitive, so "codex-acp"
# denominates the codex agent while "mimosa" does not denominate MiMo. Keep this
# list in step with the name budgets above: it is the same vocabulary, read
# through a constant instead of written in place.
agent_name_values = [
  "codex", "opencode", "claude", "gemini",
  "mimo", "minimax", "halfpocket", "kimi", "deepseek",
]
identity_names = [
  "name", "Name", "agentName", "AgentName", "agent", "agentID", "agentId", "AgentID", "agent_id",
  "provider", "providerID", "providerId", "providerName",
  "binary", "executable", "command", "cmd", "program",
  "package", "pkg", "slug", "alias",
  "model", "modelID", "modelId", "modelName",
  "tool", "toolName", "ID",
]
reviewed_pairs = [
  "Name=write_file",       # ACP tool identity: the tool summariser branches on the tool the peer reported
  "ID=quick_login",        # onboarding: auth-method ids are a closed set declared by the provider
  "ID=chatgpt",            # same closed set
  "[provider]=OpenRouter", # onboarding is provider-facing by design; the provider dimension is its subject
  "name=fork",             # ACP capability name, defined by the protocol
  # A constant that denominates an agent is reviewed as `name=const:ConstName`, so a
  # cleared literal can never silently clear a constant and a renamed constant
  # re-opens the review. The three below are what is left of the pre-existing set
  # the constant rule found (10 comparisons). The other seven — the wizard's
  # per-agent branches — were healed on 2026-10-02: the flow is owned by the
  # handler the registry resolves for the selected agent, so nothing in the wizard
  # asks who the agent is, and their pairs are gone with them.
  "agentID=const:CanonicalCodexAgentID",         # agentidentity: the canonical ID maps to the ACP registry id
  "agentID=const:CodexRegistryID",               # agentidentity: refuses the registry id as a public Matrix id
  "agentID=const:agentidentity.CodexRegistryID", # agentmgr: same refusal while resolving the registry entry
  "ID=const:acpModelConfigOptionID", # ACP protocol: the session config option id "model", a closed vocabulary
]
exclude_suffixes = ["_test.go", ".md"]
exclude_dirs = ["testdata"]
max = 0
reason = "AGNOSTICISM SHAPE CHECK: a comparison of an identity variable against a string literal, or against a package CONSTANT standing in for one, because the constant is the same branch with the value one indirection away — and that is why it passed every budget. Measured at the extension: a scratch `agentID == \"codex\"` failed three budgets while `agentID == CanonicalCodexAgentID` passed all of them; the constant is now read from the tree (same package, or a qualified constant resolved through the file's imports and go.mod) and the branch fails. The finding is decided by the SHAPE, as the literal rule is; agent_name_values only decides what the finding says. Gating the finding on the constant's VALUE was measured and rejected: it costs no review on this tree, but a brand-new agent name behind a brand-new constant passed it (probe: failures 0). The shape rule costs exactly one review here — ID=const:acpModelConfigOptionID, an ACP config-option id — and closes that hole. Measured on this tree: 4 constant comparisons (3 naming an agent, 1 a protocol id) and 0 literal comparisons, all pre-existing and cleared by the pairs above. The seven onboarding comparisons this budget first caught — the wizard's per-agent branches — are gone as of 2026-10-02 (the handler the registry resolves for the selected agent owns its own flow), and their pairs were removed with them, so the exception list cannot hide a branch that comes back. The budget closes at zero: the FIRST new comparison of an identity variable against any literal or any constant — including a name nobody has seen — fails the gate. To clear a finding: if the compared value is a closed protocol vocabulary, add the name/value PAIR to reviewed_pairs with the reason it is not an identity; if it is which agent or provider is being talked to, it is the patch this check exists to stop. Known limits, both declared rather than papered over: (1) a comparison whose left side is a call result or a dereference carries no name and is not matched; (2) a package-level `var` is not read, because it can be reassigned and its value at the comparison would not be a property of the tree; the literal budgets above still cover the names they enumerate there."
